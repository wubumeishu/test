[program:rq_worker_ai]
; RQ Worker 独立进程配置
; 部署路径：/etc/supervisor/conf.d/rq_worker.conf
; 启动命令：supervisorctl reread && supervisorctl update && supervisorctl start rq_worker_ai

command=/www/wwwroot/api.aiyuechuan.cn/bazi-admin/venv/bin/rq worker ai_analysis
directory=/www/wwwroot/api.aiyuechuan.cn/bazi-admin
user=root
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; 日志
stdout_logfile=/www/wwwroot/api.aiyuechuan.cn/bazi-admin/logs/rq_worker.log
stderr_logfile=/www/wwwroot/api.aiyuechuan.cn/bazi-admin/logs/rq_worker_err.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3

; 环境变量（从 .env 文件加载，tasks.py 内部也会 load_dotenv）
environment=PYTHONPATH="/www/wwwroot/api.aiyuechuan.cn/bazi-admin"
