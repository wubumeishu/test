# =============================================================================
# Nginx 反向代理配置 — 云水禅心 API 服务
# 域名: api.aiyuechuan.cn
#
# 安装步骤：
#   sudo cp /var/www/zenfortune/backend/deploy/nginx.conf /etc/nginx/sites-available/zenfortune
#   sudo ln -s /etc/nginx/sites-available/zenfortune /etc/nginx/sites-enabled/zenfortune
#   sudo nginx -t          # 测试配置是否正确
#   sudo systemctl reload nginx
#
# SSL 证书路径请替换为实际路径（如使用 Let's Encrypt，路径通常为）：
#   /etc/letsencrypt/live/api.aiyuechuan.cn/fullchain.pem
#   /etc/letsencrypt/live/api.aiyuechuan.cn/privkey.pem
# =============================================================================

# ── HTTP → HTTPS 强制跳转 ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.aiyuechuan.cn;

    # 将所有 HTTP 请求永久重定向到 HTTPS
    return 301 https://$host$request_uri;
}

# ── HTTPS 主服务 ──────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aiyuechuan.cn;

    # ── SSL 证书配置（请替换为实际证书路径）────────────────────────────────────
    ssl_certificate     /path/to/api.aiyuechuan.cn/fullchain.pem;
    ssl_certificate_key /path/to/api.aiyuechuan.cn/privkey.pem;

    # ── SSL 安全加固 ───────────────────────────────────────────────────────────
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS（告知浏览器后续 1 年内强制使用 HTTPS）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── 日志 ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/zenfortune_access.log;
    error_log  /var/log/nginx/zenfortune_error.log;

    # ── 请求体大小限制 ─────────────────────────────────────────────────────────
    client_max_body_size 10m;

    # ── 反向代理到 Gunicorn ────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:9000;

        # 传递真实客户端 IP
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # 传递原始 Host 头
        proxy_set_header Host               $http_host;

        # ── 跨域头（CORS）─────────────────────────────────────────────────────
        # 允许来自小程序/H5 的跨域请求
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;

        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "*";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With";
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }

        # ── 代理超时配置 ───────────────────────────────────────────────────────
        # AI 分析接口耗时较长，超时设为 120 秒
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # ── WebSocket 支持（如后续需要）────────────────────────────────────────
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ── 健康检查接口（可选：不记录访问日志，减少噪音）─────────────────────────
    location = /api/health {
        proxy_pass http://127.0.0.1:9000;
        proxy_set_header Host $http_host;
        access_log off;
    }
}
